name: Release

on:
  workflow_dispatch:
    inputs:
      type:
        description: "Release type"
        required: true
        default: "stable"
        type: choice
        options:
          - stable
          - next

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - name: Create and publish versions
        if: inputs.type == 'stable'
        uses: changesets/action@v1
        with:
          commit: "chore: update versions"
          title: "chore: update versions"
          publish: pnpm build && pnpm publish --provenance --access public --no-git-checks
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish next
        if: inputs.type == 'next'
        run: |
          pnpm changeset version
          if [[ ! -f .changeset/pre.json ]]; then
            echo "Not in prerelease mode. Run 'pnpm changeset pre enter next' first."
            exit 1
          fi
          pnpm build
          pnpm publish --access public --tag next --no-git-checks
