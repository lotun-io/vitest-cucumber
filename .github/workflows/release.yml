name: Release

on:
  workflow_dispatch:
    inputs:
      type:
        description: "Release type"
        required: true
        default: "stable"
        type: choice
        options:
          - stable
          - beta

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Create and publish versions
        if: inputs.type == 'stable'
        uses: changesets/action@v2
        with:
          commit-message: "chore: update versions"
          pr-title: "chore: update versions"
          publish-script: pnpm ci:publish
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish beta
        if: inputs.type == 'beta'
        run: |
          if [[ ! -f .changeset/pre.json ]]; then
            echo "Not in prerelease mode. Run 'pnpm changeset pre enter beta' first."
            exit 1
          fi
          # The version is made locally and committed (`pnpm changeset version`): nothing here
          # commits one. With no new changesets this step changes nothing.
          pnpm changeset version
          pnpm build
          pnpm publish --access public --tag beta --no-git-checks
