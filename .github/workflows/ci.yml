name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  test:
    name: "test ${{ matrix.os }} node${{ matrix.node-version }} cucumber${{ matrix.cucumber-version }}"
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [22, 24, 26]
        cucumber-version: ["12", "13"]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm add -D @cucumber/cucumber@${{ matrix.cucumber-version }} --config.frozen-lockfile=false
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test

  smoke:
    name: "smoke (pack + example)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm pack
      - name: Install packed tarball into example workspaces
        working-directory: example
        run: pnpm -r add "../../lotun-vitest-cucumber-$(node -p "require('../package.json').version").tgz"
      - working-directory: example
        run: pnpm -F ./browser exec playwright install --with-deps chromium
      - working-directory: example
        run: pnpm test
