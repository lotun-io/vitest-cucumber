name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  test:
    name: "test ${{ matrix.os }} node${{ matrix.node-version }}"
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # The unit tests and the root features in each mode. Not the e2e and compatibility
      # projects: too heavy for the runners (they run locally, `pnpm test`). Naming projects
      # also turns the coverage thresholds off (`vitest.config.ts`'s `partial`): they are the
      # whole suite's.
      - run: pnpm test --project unit --project node --project browser --project storybook

  smoke:
    name: "smoke (pack + example)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm pack
      - name: Install packed tarball into example workspaces
        working-directory: example
        run: pnpm -r add "../../lotun-vitest-cucumber-$(node -p "require('../package.json').version").tgz"
      # One browser build for every example: they share one Playwright version (the examples'
      # catalog, `example/pnpm-workspace.yaml`: `playwright` and `@playwright/test`).
      - name: Install the examples' browser
        working-directory: example
        run: pnpm -F ./browser exec playwright install --with-deps chromium
      - working-directory: example
        run: pnpm test
