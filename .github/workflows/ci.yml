name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  test:
    name: "test ${{ matrix.os }} node${{ matrix.node-version }}"
    runs-on: ${{ matrix.os }}
    # A whole run takes 9–12 minutes; a stalled one stops here.
    timeout-minutes: 30
    strategy:
      # Every OS and Node version runs to its end: one failing doesn't cancel the others.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps
      # The whole suite, as locally: every project, the e2e and compatibility ones too, with the
      # coverage and its thresholds. Their workers: `vitest.utils.ts`'s `e2eMaxWorkers` (half the
      # CPU threads, capped by free memory: 1 or 2 on these runners). Verbose: each test as it
      # ends, not each file, so a run that stalls shows where.
      - run: pnpm test --reporter=verbose

  smoke:
    name: "smoke (pack + example)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm pack
      - name: Install packed tarball into example workspaces
        working-directory: example
        run: pnpm -r add "../../lotun-vitest-cucumber-$(node -p "require('../package.json').version").tgz"
      # One browser build for every example: they share one Playwright version (the examples'
      # catalog, `example/pnpm-workspace.yaml`: `playwright` and `@playwright/test`).
      - name: Install the examples' browser
        working-directory: example
        run: pnpm -F ./browser exec playwright install --with-deps chromium
      - working-directory: example
        run: pnpm test
