packages:
  - "node"
  - "node-playwright"
  - "browser"
  - "storybook"

# Dependencies more than one example has, one version each (`"catalog:"` in their `package.json`).
catalog:
  "@cucumber/cucumber": ^13.3.0
  "@lotun/vitest-cucumber": 1.0.0-beta.5
  "@tsconfig/node26": ^26.0.2
  "@vitest/browser-playwright": ^5.1.1
  typescript: ~7.0.2
  vitest: ^5.1.1
  # One Playwright for every example that opens a browser, so one browser build to install
  # (`@playwright/test` depends on the `playwright` of its own version: keep the two the same).
  "@playwright/test": ^1.65.1
  playwright: ^1.65.1

allowBuilds:
  esbuild: true

minimumReleaseAgeExclude:
  - "@lotun/vitest-cucumber"
